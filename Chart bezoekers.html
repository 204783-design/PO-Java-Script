<!DOCTYPE html>
<html>
    <head>
       
        <title>Bezoekers chart</title>
    </head>
    
     
    <body>
       

        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
             <canvas id="BezoekersChart" style="width:100%;max-width:700px"></canvas>
    
        <script>
           const xValues = ["Colosseum", "Trevi fontein", "Pantheon", "Vaticaanstad", "Altare della Patria"];
          
            const yValues = [14.7, 4, 4.1 , 6.8, 0.6];
            const barColors = ["#007FFF", "#007FFF","#007FFF","#007FFF","#007FFF"];
            /* Kleur van nationale sportteams */
            


                 /* https://www.w3schools.com/ai/ai_chartjs.asp*/

            /* y values:
            https://www.nieuwsblad.be/buitenland/toeristen-moeten-vanaf-2026-betalen-voor-trevifontein/114226094.html
            https://www.cheaperthancars.com/data-hub/italy/statistics/attractions/colosseum-visitor-statistics/
            https://roadgenius.com/statistics/tourism/italy/rome/the-pantheon/
            https://roadgenius.com/statistics/tourism/italy/rome/the-pantheon/
            https://italien.news/nl/reizen/latium/rom/altare-della-patria-in-rome/
            */ 

const ctx = document.getElementById('BezoekersChart')
new Chart(ctx, {
  type: "bar",
  data: {
    labels: xValues,
    datasets: [{
      backgroundColor: barColors,
      data: yValues
    }]
  },
  options: {
    plugins: {
      legend: {display: false},
      title: {
        display: true,
        text: "Totaal aantal bezoekers 2024 (in mil)",
        font: {size: 16}
      }
    }
  }
});
        </script>
        

       
    </body>
</html>
